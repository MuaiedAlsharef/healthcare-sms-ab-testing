name: Reproducible experiment
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run automated tests
        run: python -m pytest -q
      - name: Reproduce committed experiment
        run: python main.py
      - name: Verify numerical results and README
        run: python -m src.verify_outputs
      - name: Check deterministic numerical artifacts
        run: python -m src.checksums --check
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-python-${{ matrix.python-version }}
          path: outputs/
